<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BMI Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body class="bg-dark text-white">

    <main>
      <section
        class="min-vh-100 d-flex justify-content-center align-items-center px-3 py-5"
      >

        <div class="container">
          <div class="row justify-content-center g-4">

            <article class="col-12 col-lg-5">
              <div class="card border-0 shadow-lg rounded-4 bg-black text-white h-100">

                <div class="card-body p-4 p-md-5">

                  <div class="text-center mb-4">
                    <span
                      class="badge rounded-pill bg-warning text-black fw-bold px-3 py-2"
                    >
                      HEALTH CALCULATOR
                    </span>

                    <h1 class="fw-bold mt-3 mb-2">
                      BMI Calculator
                    </h1>

                    <p class="text-secondary mb-0">
                      Enter your details to calculate your Body Mass Index.
                    </p>
                  </div>

                  <form>

                    <div class="mb-4">
                      <label
                        for="height"
                        class="form-label fw-semibold"
                      >
                        Height
                      </label>

                      <div class="input-group input-group-lg">
                        <input
                          type="number"
                          id="height"
                          class="form-control rounded-start-pill border-black"
                          placeholder="Enter your height"
                          min="1"
                        />

                        <span
                          class="input-group-text fw-semibold bg-black text-white rounded-end-pill border-black"
                        >
                          cm
                        </span>
                      </div>
                    </div>

                    <div class="mb-4">
                      <label
                        for="weight"
                        class="form-label fw-semibold"
                      >
                        Weight
                      </label>

                      <div class="input-group input-group-lg">
                        <input
                          type="number"
                          id="weight"
                          class="form-control rounded-start-pill border-black"
                          placeholder="Enter your weight"
                          min="1"
                        />

                        <span
                          class="input-group-text fw-semibold bg-black text-white rounded-end-pill border-black"
                        >
                          kg
                        </span>
                      </div>
                    </div>

                    <button
                      type="button"
                      onclick="onCalculateBtnClick()"
                      id="calculateBtn"
                      class="btn btn-outline-success btn-lg w-100 fw-bold py-3 mb-3"
                    >
                      CALCULATE BMI
                    </button>

                    <div class="d-flex gap-3">

                      <button
                        type="button"
                        onclick="onDeleteBtnClick()"
                        class="btn btn-outline-danger flex-fill py-2 fw-semibold"
                      >
                        Delete
                      </button>

                      <button
                        type="button"
                        onclick="onEditBtnClick()"
                        class="btn btn-outline-warning flex-fill py-2 fw-semibold"
                      >
                        Edit
                      </button>

                    </div>

                  </form>

                </div>
              </div>
            </article>


            <article class="col-12 col-lg-5">
              <div
                class="card border-0 shadow-lg rounded-4 bg-black text-white h-100"
              >

                <div
                  class="card-body p-4 p-md-5 d-flex flex-column justify-content-center align-items-center text-center"
                >

                  <span
                    class="badge rounded-pill bg-warning text-black fw-bold px-3 py-2 mb-4"
                  >
                    YOUR RESULT
                  </span>

                  <h2 class="fw-bold mb-4">
                    Body Mass Index
                  </h2>

                  <div class="mb-4">
                    <div
                      id="bmiStatus"
                      class="display-1 fw-bold text-success lh-1"
                    >
                      ---
                    </div>

                    <p class="text-secondary mt-2 mb-0">
                      BMI Score
                    </p>
                  </div>

                  <div>
                    <span
                      id="bmiCategory"
                      class="badge rounded-pill text-bg-success px-4 py-3 fs-6"
                    >
                      Enter your details
                    </span>
                  </div>

                  <hr class="w-100 my-4 border-secondary" />

                  <p class="text-secondary mb-0">
                    Your BMI result will appear here after calculation.
                  </p>

                </div>
              </div>
            </article>

          </div>
        </div>

      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
